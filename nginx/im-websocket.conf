# Minimal reverse proxy for H5 Instant Messaging (HTTP + WebSocket / WSS).
# Mount as: /etc/nginx/conf.d/default.conf
#
# Common pitfalls this template avoids:
# 1) Missing Upgrade / Connection headers → WS handshake fails
# 2) proxy_read_timeout too low → idle sockets drop around ~60s
# 3) buffering on → long-lived WS frames get delayed

upstream im_app {
    # Docker Compose: host.docker.internal → Django on the host (:2083)
    # Bare-metal Nginx: change to 127.0.0.1:2083
    server host.docker.internal:2083;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    location /static/ {
        alias /var/www/im/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # WebSocket endpoint used by the demo: /ws/thread/<id>/
    location /ws/ {
        proxy_pass http://im_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://im_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# TLS tip (production): terminate HTTPS on 443, keep the same /ws/ block,
# and ensure clients connect with wss://. Do not forget proxy_set_header
# X-Forwarded-Proto $scheme so Django CSRF / secure cookies stay correct.
