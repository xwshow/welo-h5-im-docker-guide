{% extends "base.html" %}
{% block title %}消息{% endblock %}
{% block content %}
<header class="navbar">
  <h1>消息</h1>
  <a class="nav-right" href="{% url 'friends' %}">通讯录</a>
</header>
<ul class="list">
  {% for row in rows %}
    <li>
      <a class="cell" href="{% url 'thread' row.thread.id %}">
        <strong>{{ row.other.username }}</strong>
        <span>{{ row.last.body|default:"暂无消息" }}</span>
      </a>
    </li>
  {% empty %}
    <li class="empty">暂无会话。去通讯录添加好友后即可聊天。</li>
  {% endfor %}
</ul>
<p class="hint"><a href="{% url 'logout' %}">退出登录</a></p>
{% endblock %}
