{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<header class="navbar"><h1>注册</h1></header>
<form method="post" class="sheet">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <label>账号 {{ form.username }}</label>
  <label>密码 {{ form.password1 }}</label>
  <label>确认密码 {{ form.password2 }}</label>
  <button type="submit" class="btn">注册</button>
</form>
<p class="hint"><a href="{% url 'login' %}">已有账号？登录</a></p>
{% endblock %}
