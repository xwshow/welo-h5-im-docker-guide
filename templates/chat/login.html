{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<header class="navbar"><h1>登录</h1></header>
<form method="post" class="sheet">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <label>账号 {{ form.username }}</label>
  <label>密码 {{ form.password }}</label>
  <button type="submit" class="btn">登录</button>
</form>
<p class="hint"><a href="{% url 'register' %}">没有账号？注册</a></p>
{% endblock %}
