# Lightweight infra template for an H5 IM stack.
# - redis: channel layer / pub-sub for multi-process ASGI
# - nginx: reverse proxy with WebSocket Upgrade headers
#
# Local app demo (no Docker required for Django):
#   python manage.py migrate && python manage.py runserver 0.0.0.0:2083
#
# Then start infra:
#   docker compose up -d

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/im-websocket.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # Lets the container reach Django on the host (port 2083).
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
